# Telegram (secrets like API id/hash/session live in .env or GitHub Secrets)
telegram:
  source_chat: "me" # "me" = your own Saved Messages, shared with the other pipelines.
  require_tag: "ig:" # Only videos whose caption starts with this tag belong to Instagram. Tag is stripped off before use as the topic.

# Digital products this account promotes (store: claimthis.site). Captions become "value first,
# sell second": the AI picks the ONE item that matches each video's topic (or none if nothing fits)
# and ends with the CTA. Instagram captions are not clickable: put the store link in the bio.
product:
  enabled: true
  store: "Claim This"
  cta: "Link in bio"
  shopify_url: "https://www.claimthis.site" # catalog is read from <url>/products.json on every run (new products appear automatically)
  extra_items: [] # products NOT in the store, e.g. - {name: "...", description: "..."}
  fallback_items: # used only if the store can't be reached

    - name: "The Sandwich Generation Starter Pack"
      description: "4 printables for caregivers raising kids while caring for aging parents"
    - name: "The ADHD Meltdown Toolkit"
      description: "printable calm-down strategies for parents when ADHD meltdowns happen"
    - name: "Type 2 Diabetes Daily Companion"
      description: "printable daily tracking pack for people managing their type 2 diabetes routine"

# AI Configuration (Groq, free tier)
ai:
  text_model: "openai/gpt-oss-120b"

# Trending signal
keywords:
  max_trending: 10 # Google Trends rising/top related queries to feed the AI

# Safety limits
limits:
  max_uploads_per_run: 3

# Drip-feed schedule: if you send several videos at once, this spaces out the
# actual publishing instead of uploading them all back-to-back.
schedule:
  post_interval_hours: 0 # Minimum hours between two uploads. 0 = disabled (post as soon as found).

# Paths (relative to project root)
paths:
  state_file: "data/state.json"
  downloads_dir: "downloads"
